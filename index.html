<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            margin: 0;
            height: 100%;

        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        //initialize map
        var map = L.map('map').setView([-6.2729830, 106.7431641], 13);



        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var OpenStreetMap_Mapnik = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        var Google_Satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: 'Google'
        });

        var Google_Terrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: 'Google'
        });

        // Menambahkan basemap ke dalam peta
        Google_Terrain.addTo(map);

        // Marker
        var marker = L.marker([-6.2729830, 106.7431641]);
        var marker2 = L.marker([-7.0597210, 110.3906250]);
        var marker3 = L.marker([-7.5694552, 110.8328247]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);
        marker3.addTo(map);

        // Popup
        marker.bindPopup("<b>Jakarta</b> Indonesia's massive capital, sits on the northwest coast of the island of Java. A historic mix of cultures – Javanese, Malay, Chinese, Arab, Indian and European – has influenced its architecture, language and cuisine. The old town, Kota Tua, is home to Dutch colonial buildings, Glodok (Jakarta’s Chinatown) and the old port of Sunda Kelapa, where traditional wooden schooners dock.");
        marker.openPopup();
        marker2.bindPopup("<b>Semarang</b> Semarang is the capital and largest city of Central Java province in Indonesia. It was a major port during the Dutch colonial era, and is still an important regional center and port today.");
        marker2.openPopup();
        marker3.bindPopup("<b>Surakarta</b> a city and historic royal capital on the Indonesian island of Java. The 18th-century Keraton Kasunanan was the royal family’s residence and today is a museum of heirlooms, while Mangkunegaran palace has an elaborately painted pavilion. Surakarta is also a major center for dyed batik fabric, which is displayed at the Danar Hadi museum.");
        marker3.openPopup();


        // Tooltip
        marker.bindTooltip("Jakarta");
        marker.openTooltip();
        marker2.bindTooltip("Semarang");
        marker2.openTooltip();
        marker3.bindTooltip("Surakarta");
        marker3.openTooltip();


        // Circle
        var circle = L.circle([-7.178896, 110.3475552], {
            color: "yellow", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f03", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1500, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        circle.bindPopup("<b>Ungaran</b>");
        circle.openPopup();

        circle.bindTooltip("Ungaran", { sticky: true });
        circle.openTooltip();


        // Polyline
        var vertexPolyline = [
            [-7.3005618128235295, 109.99538704052213],
            [-7.379985887120213, 110.0739658826981],
            [-7.457906902806448, 110.43833147159562],
            [-7.540775816525012, 110.44483800143327],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 4, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        polyline.bindPopup("<b>🌄</b>");
        polyline.openPopup();

        polyline.bindTooltip("3 Gunung Jawa Tengah", { sticky: true });
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-7.7443683628517705, 110.34330564041258],
            [-7.764040027943255, 110.4283907955997],
            [-7.8370981326859575, 110.41279185048207],
            [-7.8155468005674, 110.32203435161578],
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "blue", // warna garis
            weight: 4, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        polygon.bindPopup("<b>🌤️</b>");
        polygon.openPopup();

        polygon.bindTooltip("Kota Yogyakarta panas bgt", { sticky: true });
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Google Terrain": Google_Terrain,
            "Google Satellite": Google_Satellite,
        };
        var overlayMaps = {
            "Marker": marker,
            "Marker 2": marker2,
            "Marker 3": marker3,
            "Circle": circle,
            "Polyline": polyline,
            "Polygon": polygon,
        };
        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);
        
        // Scale 
        var scale = L.control.scale({
            position: "bottomright",
        });
        scale.addTo(map);
        imperial: false;

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);


    </script>
</body>

</html>
